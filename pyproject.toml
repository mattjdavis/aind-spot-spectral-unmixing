[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aind-spot-spectral-unmixing"
version = "0.1.0"
description = "Spot spectral unmixing for AIND HCR data"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "aind-hcr-data-loader",
    "aind-hcr-qc",
]

[tool.setuptools.packages.find]
include = ["aind_spot_spectral_unmixing*"]